<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="reap-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03080A" />
      <stop offset="50%" stop-color="#081820" />
      <stop offset="100%" stop-color="#020406" />
    </linearGradient>
    <linearGradient id="teal-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <radialGradient id="reap-glow" cx="75%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#03080A" stop-opacity="0" />
    </radialGradient>
    <pattern id="arch-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#06B6D4" stroke-width="0.5" stroke-opacity="0.06" />
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="url(#reap-bg)" />
  <rect width="1200" height="420" fill="url(#reap-glow)" />
  <rect width="1200" height="420" fill="url(#arch-grid)" />

  <rect x="20" y="20" width="1160" height="380" rx="14" fill="none" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.2" />

  <!-- Fractional Real Estate & ZK Contract Art (Right Side) -->
  <g transform="translate(850, 210)">
    <!-- Isometric Skyscraper Silhouette -->
    <!-- Tower Main Column -->
    <polygon points="0,-120 40,-100 40,60 0,80 -40,60 -40,-100" fill="#0C202B" stroke="#06B6D4" stroke-width="2" />
    <!-- Tower Facet Lines -->
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.4" />
    <line x1="-40" y1="-50" x2="0" y2="-30" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.3" />
    <line x1="0" y1="-30" x2="40" y2="-50" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.3" />
    <line x1="-40" y1="0" x2="0" y2="20" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.3" />
    <line x1="0" y1="20" x2="40" y2="0" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.3" />

    <!-- Fractional Tokenized Bricks Floating Off Building -->
    <g transform="translate(75, -60)">
      <polygon points="0,-20 20,-10 0,0 -20,-10" fill="#F59E0B" fill-opacity="0.3" stroke="#F59E0B" stroke-width="1.5" />
      <polygon points="-20,-10 0,0 0,18 -20,8" fill="#1A1208" stroke="#F59E0B" stroke-width="1" />
      <polygon points="0,0 20,-10 20,8 0,18" fill="#2B1D0B" stroke="#F59E0B" stroke-width="1" />
      <text x="0" y="32" fill="#F59E0B" font-family="'SF Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">TOKEN #412</text>
    </g>

    <g transform="translate(90, 20)">
      <polygon points="0,-16 16,-8 0,0 -16,-8" fill="#10B981" fill-opacity="0.3" stroke="#10B981" stroke-width="1.5" />
      <polygon points="-16,-8 0,0 0,14 -16,6" fill="#071E15" stroke="#10B981" stroke-width="1" />
      <polygon points="0,0 16,-8 16,6 0,14" fill="#0C2E20" stroke="#10B981" stroke-width="1" />
      <text x="0" y="26" fill="#10B981" font-family="'SF Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">FRACTIONAL</text>
    </g>

    <!-- ZK Shield Lock (Left) -->
    <g transform="translate(-85, 0)">
      <path d="M 0 -30 L 25 -15 L 25 10 Q 25 28 0 38 Q -25 28 -25 10 L -25 -15 Z" fill="#08202E" stroke="#06B6D4" stroke-width="2" />
      <circle cx="0" cy="0" r="5" fill="#14B8A6" />
      <path d="M 0 5 L 0 14" stroke="#14B8A6" stroke-width="2.5" stroke-linecap="round" />
      <text x="0" y="55" fill="#38BDF8" font-family="'SF Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">ZK PROOFS</text>
    </g>

    <text x="0" y="130" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11" letter-spacing="1" text-anchor="middle">REAL ESTATE ASSET TOKENIZATION</text>
  </g>

  <!-- Content (Left Side) -->
  <g transform="translate(70, 75)">
    <rect width="250" height="30" rx="15" fill="#06B6D4" fill-opacity="0.12" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="16" cy="15" r="4" fill="#06B6D4" />
    <text x="28" y="19" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">REAL ESTATE ASSET PROTOCOL</text>

    <text x="0" y="85" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">
      REAP
    </text>

    <rect x="0" y="105" width="85" height="4" rx="2" fill="url(#teal-amber)" />

    <text x="0" y="150" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" letter-spacing="-0.2">
      Zero-knowledge asset distribution protocol built on Midnight Network Compact contracts.
    </text>

    <text x="0" y="180" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Fractional real estate tokenization ensuring verifiable compliance without exposing investor balances.
    </text>

    <g transform="translate(0, 240)">
      <rect width="170" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
      <text x="14" y="22" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11">LEDGER: MIDNIGHT NTWRK</text>

      <rect x="185" y="0" width="180" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
      <text x="199" y="22" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11">CONTRACTS: COMPACT</text>

      <rect x="380" y="0" width="160" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
      <text x="394" y="22" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11">SLA: 24H RESPONSE</text>
    </g>
  </g>
</svg>